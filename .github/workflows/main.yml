name: Build WF
on:
    push:
       branches:
            - main
    pull_request:
        branches:
            - main
            - feature
    workflow_dispatch:
    
    schedule:
        - cron: "10 14 * * 1-5" 
        # Run every weekday at 2:10 PM (14:10) UTC

permissions:
    contents: read

jobs:
    Build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                fetch-depth: 0

            - name: Maven Build
              run: mvn install
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: vprofile-app
                path: target/*.war
            - name: Notification for build failed
              if: failure()
              run: echo "build failed please check logs"

    Testing:
        runs-on: ubuntu-latest
        needs: Build

        steps:
            - name: checkout code
              uses: actions/checkout@v5
              with:
                fetch-depth: 0

            - name: run test on main branch
              if: github.ref == 'refs/heads/main'
              run: mvn test

            - name: Checkstyle
              if: github.ref == 'refs/heads/main'
              run: mvn checkstyle:checkstyle

            - name: Run test on other branches
              if: github.ref != 'refs/heads/main'
              run: echo "Skipping unit tests and code analysis for non-main branches"     
      Security_Scan:
        runs-on: ubuntu-latest
        needs: Build

        steps:
            - name: checkout code
              uses: actions/checkout@v5
              with:
                fetch-depth: 0

            - name: Run security scan on main branch
              uses: aquasecurity/trivy-action@0.28.0
              with:
                scan-type: 'fs'
                scan-ref: .
                format: json
                exit-code: '0'
                vulnerability-type: 'os,library'
                output: 'trivy-report.json'
                severity: 'CRITICAL,HIGH'

            - name: Upload security scan report
              if: github.ref == 'refs/heads/main'
              uses: actions/upload-artifact@v4
              with:
                name: trivy-report
                path: trivy-report.json