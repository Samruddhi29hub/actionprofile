name: Build WF
on:
    push:
       branches:
            - main
    pull_request:
        branches:
            - main
            - feature
    workflow_dispatch:
    
    schedule:
        - cron: "10 14 * * 1-5" 
        # Run every weekday at 2:10 PM (14:10) UTC

jobs:
    Build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                fetch-depth: 0

            - name: Maven Build
              run: mvn install

    Testing:
        runs-on: ubuntu-latest
        needs: Build

        steps:
            - name: checkout code
              uses: actions/checkout@v5
              with:
                fetch-depth: 0

            - name: run test on main branch
              run: mvn test

            - name: Checkstyle
              run: mvn checkstyle:checkstyle

            
    
